<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Le Grand Débat · le jeu de la Ve République</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b2a6f'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23d6202f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,800;0,900;1,700;1,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bleu:#0b2a6f;--rouge:#d6202f;--blanc:#ffffff;
  --bg:#f6f2ea;--hd:rgba(246,242,234,.92);--surf:#ffffff;--surf2:#efe9dc;
  --ink:#0c1a3a;--ink2:#4b5879;--line:rgba(12,26,58,.13);
  --btn2:#ffffff;--btn2ink:#0c1a3a;
  --shadow:0 12px 32px rgba(8,22,60,.14);--shadow2:0 4px 14px rgba(8,22,60,.12);
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#050f2b;--hd:rgba(5,15,43,.92);--surf:#0d1c44;--surf2:#13275a;
    --ink:#f3f5fb;--ink2:#a9b6d6;--line:rgba(255,255,255,.15);
    --btn2:#13275a;--btn2ink:#f3f5fb;
    --shadow:0 14px 36px rgba(0,0,0,.55);--shadow2:0 4px 16px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#050f2b;--hd:rgba(5,15,43,.92);--surf:#0d1c44;--surf2:#13275a;
  --ink:#f3f5fb;--ink2:#a9b6d6;--line:rgba(255,255,255,.15);
  --btn2:#13275a;--btn2ink:#f3f5fb;
  --shadow:0 14px 36px rgba(0,0,0,.55);--shadow2:0 4px 16px rgba(0,0,0,.45);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 420px at 85% -80px,rgba(214,32,47,.10),transparent 60%),
    radial-gradient(900px 480px at 5% -120px,rgba(11,42,111,.16),transparent 60%);
  background-repeat:no-repeat;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:60}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #6aa0ff;outline-offset:2px}
em{font-style:italic}
h1,h2,h3{font-family:var(--serif);line-height:1.1;letter-spacing:-.01em}

/* ===== en-tête ===== */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.flagbar{display:flex;height:4px}
.flagbar i{flex:1}
.flagbar i:nth-child(1){background:#0b2a6f}
.flagbar i:nth-child(2){background:#fff}
.flagbar i:nth-child(3){background:#d6202f}
.hdr-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:9px;cursor:pointer}
.brand .cocarde{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#d6202f 0 28%,#fff 28% 60%,#0b2a6f 60%);box-shadow:0 0 0 1.5px var(--line)}
.hdr-sp{flex:1}
.pill{font-size:.78rem;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--surf2);color:var(--ink2)}
.iconbtn{font-size:.85rem;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--surf2);color:var(--ink)}
.iconbtn:hover{filter:brightness(.97)}

/* ===== mise en page ===== */
#app{max-width:1120px;margin:0 auto;padding:18px 16px 56px}
.scr{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rouge)}
.lead{font-size:1.08rem;color:var(--ink2);max-width:60ch}
.muted{color:var(--ink2)}
.stack>*+*{margin-top:14px}
.center{text-align:center}
.mt{margin-top:22px}

/* ===== boutons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:700;background:var(--btn2);color:var(--btn2ink);box-shadow:var(--shadow2);border:1px solid var(--line);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:linear-gradient(180deg,#e12a39,#c4182a);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(214,32,47,.38)}
.btn.big{padding:15px 28px;font-size:1.05rem}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ===== accueil ===== */
.hero{display:grid;gap:28px;align-items:center;padding:12px 0 6px}
@media(min-width:900px){.hero{grid-template-columns:1.1fr .9fr}}
.hero h1{font-size:clamp(2.6rem,8vw,4.8rem);font-weight:900}
.hero h1 em{color:var(--rouge);font-style:italic}
.hero h1::after{content:"";display:block;height:9px;width:150px;margin-top:16px;border-radius:99px;background:linear-gradient(90deg,#0b2a6f 0 33.3%,#fff 33.3% 66.6%,#d6202f 66.6%);box-shadow:0 0 0 1.5px var(--line)}
.fan{position:relative;height:330px;max-width:420px;margin:0 auto;width:100%}
.fan .pc{position:absolute;width:210px;left:50%;top:10px;margin-left:-105px;transform-origin:50% 120%;animation:fanin .9s cubic-bezier(.2,.8,.2,1) both}
.fan .pc:nth-child(1){transform:rotate(-13deg) translateX(-62px)}
.fan .pc:nth-child(2){transform:rotate(0) translateY(-10px);z-index:2;animation-delay:.1s}
.fan .pc:nth-child(3){transform:rotate(13deg) translateX(62px);animation-delay:.2s}
@keyframes fanin{from{opacity:0;transform:translateY(40px) rotate(0)}}
.steps{display:grid;gap:12px;margin-top:30px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.step{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px 16px 18px;box-shadow:var(--shadow2)}
.step b{font-family:var(--serif);font-size:2rem;color:var(--rouge);display:block;line-height:1}
.step h3{font-size:1.1rem;margin:6px 0 4px}
.step p{font-size:.92rem;color:var(--ink2)}
.fine{font-size:.82rem;color:var(--ink2);margin-top:18px}

/* ===== formulaires ===== */
.panel{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow2)}
.panel h2{font-size:1.5rem;margin-bottom:4px}
.lbl{display:block;font-weight:700;font-size:.9rem;margin:18px 0 8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:9px 16px;border-radius:12px;background:var(--surf2);font-weight:700;border:2px solid transparent;color:var(--ink)}
.seg button.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}
:root[data-theme="dark"] .seg button.on{background:#e8eefc;color:#06133a;border-color:#e8eefc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{background:#e8eefc;color:#06133a;border-color:#e8eefc}}
.names{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.field{display:flex;align-items:center;gap:10px;background:var(--surf2);border-radius:14px;padding:6px 12px}
.field span{font-weight:800;color:var(--rouge);font-family:var(--serif)}
.field input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:8px 0;outline:none}
.hint{font-size:.85rem;color:var(--ink2);margin-top:6px}

/* ===== cartes ===== */
.pc{--c1:#2147a6;--c2:#0b2467;position:relative;display:flex;flex-direction:column;text-align:left;border-radius:20px;overflow:hidden;background:var(--surf);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.pc-top{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:11px 14px;display:flex;align-items:center;gap:10px}
.pc-top .emb{width:38px;height:38px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.pc-party{flex:1;font-weight:800;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;line-height:1.2}
.era{font-size:.66rem;font-weight:800;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.22);letter-spacing:.04em;white-space:nowrap}
.pc-body{padding:14px 16px 14px;display:flex;flex-direction:column;gap:5px}
.mono{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:1.25rem;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 0 3px var(--surf),0 0 0 5px var(--c1);margin-bottom:6px}
.pc h3{font-size:1.4rem}
.role{font-size:.85rem;color:var(--ink2);font-weight:600}
.tag{font-style:italic;font-family:var(--serif);color:var(--ink2);font-size:.95rem}
.sig{margin-top:8px;font-size:.88rem;background:var(--surf2);border-left:4px solid var(--c1);border-radius:8px;padding:8px 10px}
.sig b{display:block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--c1);margin-bottom:2px}
:root[data-theme="dark"] .sig b{color:#fff;opacity:.75}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sig b{color:#fff;opacity:.75}}
.pc::after{content:"";display:block;height:7px;margin-top:auto;background:linear-gradient(90deg,#0b2a6f 0 33.4%,#fff 33.4% 66.7%,#d6202f 66.7%)}
.pc.mini .pc-body{padding:12px 14px}
.pc.mini h3{font-size:1.15rem}
.pc.mini .sig{display:none}
.pc.click{cursor:pointer;transition:transform .18s,box-shadow .18s}
.pc.click:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(8,22,60,.22)}

/* ===== duels ===== */
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.dhead h2{font-size:clamp(1.8rem,5vw,2.8rem)}
.pips{display:flex;gap:5px;margin:8px 0 18px}
.pips i{flex:1;height:7px;border-radius:99px;background:var(--surf2)}
.pips i.d{background:linear-gradient(90deg,#0b2a6f,#d6202f)}
.pips i.n{background:var(--rouge);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}
.duel{display:grid;gap:10px;position:relative;grid-template-columns:1fr}
@media(min-width:780px){.duel{grid-template-columns:1fr 64px 1fr;gap:0;align-items:stretch}}
.duel .pc{width:100%;padding:0;border:2px solid var(--line);transition:transform .25s,opacity .25s,box-shadow .25s}
.duel .pc.big-click{cursor:pointer}
.duel .pc.big-click:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(8,22,60,.25)}
.duel .pc .pc-body{flex:1}
.vs{display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-style:italic;font-size:1.4rem;color:#fff;background:var(--rouge);width:48px;height:48px;border-radius:50%;margin:-4px auto;position:relative;z-index:3;box-shadow:0 6px 16px rgba(214,32,47,.45)}
@media(min-width:780px){.vs{align-self:center;margin:0 auto}}
.duel .pc.won{transform:scale(1.02);border-color:var(--rouge);box-shadow:0 0 0 4px rgba(214,32,47,.25),var(--shadow)}
.duel .pc.lost{opacity:.35;transform:scale(.97)}
.choose{font-size:.8rem;color:var(--ink2);text-align:center;margin-top:12px}

/* ===== carte finale ===== */
.reveal{display:grid;gap:22px;align-items:start}
@media(min-width:860px){.reveal{grid-template-columns:minmax(320px,430px) 1fr}}
.pc.big{max-width:440px;width:100%;margin:0 auto;animation:flip .9s cubic-bezier(.2,.8,.2,1) both;position:relative}
.pc.big h3{font-size:2rem}
.pc.big .mono{width:72px;height:72px;font-size:1.7rem}
.pc.big::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.25) 48%,transparent 66%);transform:translateX(-120%);animation:sheen 2.4s .7s ease-out forwards;pointer-events:none;z-index:2}
@keyframes flip{from{opacity:0;transform:perspective(900px) rotateY(90deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes sheen{to{transform:translateX(120%)}}
.ideas{display:grid;gap:8px;margin-top:8px}
.idea{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.idea .ic{font-size:1.3rem;line-height:1.3}
.idea b{display:block;font-size:.95rem}
.idea span{font-size:.85rem;color:var(--ink2)}

/* ===== passer le téléphone ===== */
.pass{min-height:62vh;display:grid;place-items:center;text-align:center}
.pass .box{max-width:520px}
.pass .bubble{width:92px;height:92px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;font-size:2.4rem;background:linear-gradient(135deg,#0b2a6f,#d6202f);box-shadow:0 12px 30px rgba(11,42,111,.4);animation:float 2.8s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.pass h2{font-size:clamp(2rem,6vw,3rem);margin-bottom:10px}
.pass h2 em{color:var(--rouge)}

/* ===== sujet ===== */
.theme-hero{background:linear-gradient(135deg,#0b2a6f,#08184a 60%,#6d0f1b);color:#fff;border-radius:26px;padding:26px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.theme-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)}
.theme-hero .ico{font-size:2.6rem}
.theme-hero h2{font-size:clamp(1.6rem,4.6vw,2.5rem);margin:8px 0 10px}
.theme-hero p{color:rgba(255,255,255,.86);max-width:75ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:.78rem;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff}
.chip.d{background:var(--surf2);border-color:var(--line);color:var(--ink)}

/* ===== débat ===== */
.board{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));margin-top:14px}
.dc{--c1:#2147a6;--c2:#0b2467;position:relative;background:var(--surf);border:2px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow2);transition:transform .2s,box-shadow .2s,border-color .2s}
.dc-top{display:flex;align-items:center;gap:10px;padding:9px 12px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.dc-top .emb{width:30px;height:30px;flex:none}
.dc-top b{font-family:var(--serif);font-size:1.05rem;line-height:1.1}
.dc-top small{display:block;opacity:.85;font-size:.72rem;font-weight:600}
.dc-who{margin-left:auto;font-weight:800;font-size:.72rem;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:99px;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.dc-body{padding:12px 14px 14px}
.dc-body h4{font-family:var(--serif);font-size:1.08rem;line-height:1.2;margin-bottom:5px}
.dc-body p{font-size:.88rem;color:var(--ink2)}
.joker{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#f3c64a;color:#4a3300;border-radius:99px;padding:2px 9px;margin-bottom:6px}
.dc.speaking{transform:scale(1.015);border-color:var(--rouge);box-shadow:0 0 0 4px rgba(214,32,47,.22),var(--shadow)}
.dc.target{border-color:#4a7be0;box-shadow:0 0 0 4px rgba(74,123,224,.22),var(--shadow2)}
.dc .tg{display:block;text-align:right;margin-top:8px;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.dc.speaking .tg{color:var(--rouge)}
.dc.target .tg{color:#4a7be0}
.dock{position:sticky;bottom:0;z-index:40;margin:18px -16px -56px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--hd);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(8,22,60,.12)}
.dock-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring{position:relative;width:96px;height:96px;flex:none;cursor:pointer}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:var(--surf2)}
.ring .fg{stroke:var(--bleu);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
:root[data-theme="dark"] .ring .fg{stroke:#8db0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ring .fg{stroke:#8db0ff}}
.dock.run .ring .fg{stroke:var(--rouge)}
.dock.done .ring .fg{stroke:var(--rouge)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--serif);font-weight:800;font-size:1.55rem;line-height:1}
.ring .num small{display:block;font-family:var(--sans);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin-top:3px}
.dock.done .ring .num{color:var(--rouge);animation:pulse .8s 3}
.dock-txt{flex:1;min-width:210px}
.dock-txt .st{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--rouge)}
.dock-txt .who{font-family:var(--serif);font-size:1.3rem;font-weight:800;line-height:1.15}
.dock-txt .h{font-size:.85rem;color:var(--ink2)}
.dock .row{gap:8px}
.dock .btn{padding:10px 16px}

/* ===== vote / résultats ===== */
.vlist{display:grid;gap:10px;margin-top:14px}
.vopt{--c1:#2147a6;--c2:#0b2467;display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow2);transition:transform .15s,border-color .15s}
.vopt:hover{transform:translateY(-2px)}
.vopt.on{border-color:var(--rouge);box-shadow:0 0 0 4px rgba(214,32,47,.2)}
.vopt .mono{margin:0;width:46px;height:46px;font-size:1.05rem;flex:none}
.vopt b{font-family:var(--serif);font-size:1.12rem;display:block}
.vopt span{font-size:.85rem;color:var(--ink2)}
.vopt .ck{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.9rem;color:#fff}
.vopt.on .ck{background:var(--rouge);border-color:var(--rouge)}
.podium{display:grid;gap:12px;margin-top:16px}
.prow{--c1:#2147a6;--c2:#0b2467;position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surf);border:2px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow2);overflow:hidden}
.prow.win{border-color:#e0a81f;background:linear-gradient(135deg,var(--surf),rgba(240,196,60,.16))}
.prow .rank{font-family:var(--serif);font-weight:900;font-size:1.9rem;width:42px;text-align:center;color:var(--ink2)}
.prow.win .rank{color:#d49a0b}
.prow .nm{font-family:var(--serif);font-weight:800;font-size:1.2rem;line-height:1.15}
.prow .cn{font-size:.85rem;color:var(--ink2)}
.bar{height:9px;border-radius:99px;background:var(--surf2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--c2));transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.prow .sc{font-family:var(--serif);font-weight:900;font-size:1.8rem;text-align:right;line-height:1}

addStance("hollande", "vie", "Une assistance médicale pour mourir dans la dignité", "Candidat en 2012, il propose qu’un malade incurable en phase avancée puisse demander une assistance médicale pour terminer sa vie dans la dignité. Son quinquennat aboutit à la loi Claeys-Leonetti de 2016 (sédation profonde et continue), sans aller jusqu’à l’aide active à mourir.");
addStance("chirac", "vie", "La loi Leonetti : ni acharnement, ni euthanasie", "Sous sa présidence, la loi du 22 avril 2005 interdit l’obstination déraisonnable et permet de limiter ou d’arrêter les traitements, sans autoriser l’euthanasie.");
addStance("macron", "vie", "Ouvrir le débat, puis promulguer la loi", "Candidat en 2022, il s’engage à ouvrir le débat : convention citoyenne en 2022-2023, puis projet de loi. Il promulgue la loi sur le droit à l’aide à mourir le 18 août 2026.");
addStance("chirac", "mil", "Suspendre la conscription et professionnaliser l’armée", "En février 1996, il annonce la professionnalisation des armées et la fin du service militaire obligatoire ; la loi de 1997 suspend la conscription.");
addStance("jospin", "mil", "Remplacer la conscription par une journée d’appel", "Son gouvernement fait voter en 1997 la suspension de la conscription, remplacée par une journée d’appel de préparation à la défense.");
addStance("macron", "mil", "Un service militaire volontaire de dix mois", "Le 27 novembre 2025, il annonce un service « volontaire et purement militaire » de dix mois pour les 18-25 ans, rémunéré 800 euros minimum par mois, qui remplace le SNU. Le Parlement pourra le rendre obligatoire en cas de crise majeure.");
addStance("bardella", "mil", "Rétablir un service militaire, d’abord pour les volontaires", "En novembre 2025, il se dit favorable au rétablissement d’un service sous les drapeaux, en commençant par un service militaire ouvert aux volontaires.");
addStance("melenchon", "can", "Légaliser le cannabis", "Candidat en 2017 puis en 2022, il propose la légalisation du cannabis et juge hypocrite de l’interdire.");
addStance("glucksmann", "can", "Légaliser au nom du pragmatisme", "En 2019, il cosigne avec plus de 70 personnalités, dont Yannick Jadot, une tribune appelant les pouvoirs publics à légaliser le cannabis au nom du pragmatisme.");
addStance("macron", "can", "Non à la légalisation, oui au cannabis thérapeutique", "En 2019, il déclare ne pas être favorable à la légalisation du cannabis ou des usages non encadrés, faute d’études robustes sur ses effets sur la vigilance des plus jeunes ; il reconnaît des vertus au cannabis thérapeutique dans certains traitements.");
addStance("attal", "can", "Ouvrir le débat sans légaliser", "En 2019, alors secrétaire d’État à la Jeunesse, il se dit favorable à l’ouverture d’un débat sur la légalisation, au lendemain du lancement d’une mission parlementaire.");
addStance("mlepen", "can", "Lutter contre le cannabis plutôt que le légaliser", "Elle s’est opposée à la légalisation du cannabis lors de la présidentielle de 2017 et privilégie la lutte contre le trafic et la consommation.");
addStance("hidalgo", "zfe", "Moins de voitures, plus de vélos et de piétons", "Maire de Paris, elle fait fermer les voies sur berges de la rive droite aux voitures (2016), multiplier les pistes cyclables, limiter la ville à 30 km/h (2021) et le périphérique à 50 km/h (2024).");
addStance("royal", "zfe", "Pas d’écologie punitive : l’abandon de l’écotaxe", "Le 9 octobre 2014, après les manifestations des Bonnets rouges en Bretagne, elle enterre l’écotaxe sur les poids lourds, qu’elle juge punitive. Elle défend une écologie positive : aides à la voiture électrique, crédit d’impôt pour la transition énergétique, interdiction des sacs plastiques jetables.");
addStance("sarkozy", "zfe", "« L’environnement, ça commence à bien faire »", "En mars 2010, au Salon de l’agriculture, il lâche que l’environnement, « ça commence à bien faire », après avoir lancé le Grenelle de l’environnement en 2007.");
addStance("philippe", "zfe", "Limiter la vitesse à 80 km/h", "Premier ministre, il fait abaisser la vitesse maximale à 80 km/h sur les routes à double sens sans séparateur central en juillet 2018, pour réduire la mortalité routière. La mesure est assouplie en 2020 : les départements peuvent revenir à 90 km/h.");
addStance("macron", "zfe", "Les ZFE, marqueur de son premier quinquennat", "Créées en 2019 et étendues en 2021, les zones à faibles émissions sont un marqueur de son premier mandat. En 2026, le gouvernement s’oppose à leur suppression et 70 députés de la majorité saisissent le Conseil constitutionnel, qui la censure.");
addStance("mlepen", "zfe", "Supprimer les ZFE", "Les députés RN ont voté avec LR la suppression des zones à faibles émissions et ont dénoncé la censure du Conseil constitutionnel comme une décision injuste contre les Français.");
addStance("retailleau", "zfe", "Supprimer les ZFE", "Son parti, Les Républicains, a voté avec le RN la suppression des zones à faibles émissions à l’Assemblée nationale ; le président du groupe LR, Laurent Wauquiez, a dénoncé la censure du Conseil constitutionnel.");
addStance("tondelier", "zfe", "Garder les ZFE", "Les députés écologistes, avec les socialistes, ont saisi le Conseil constitutionnel contre la suppression des zones à faibles émissions.");
addStance("faure", "zfe", "Garder les ZFE", "Les députés socialistes ont saisi, avec les écologistes, le Conseil constitutionnel contre la suppression des zones à faibles émissions.");
addStance("mitterrand", "etr", "Le droit de vote des immigrés aux élections locales", "En 1981, la proposition 80 de ses « 110 propositions » promet ce droit. Il ne la fera jamais aboutir.");
addStance("hollande", "etr", "Voter après cinq ans de résidence", "En 2012, il promet le droit de vote aux élections locales pour les étrangers non européens résidant en France depuis cinq ans. Cela exigeait de réviser la Constitution : la réforme n’aboutit pas.");
addStance("melenchon", "etr", "Le droit de vote aux élections locales", "LFI propose d’ouvrir le droit de vote aux élections locales aux étrangers résidant en France.");
addStance("poutou", "etr", "Le droit de vote pour tous les résidents", "Le NPA défend le droit de vote et d’éligibilité des étrangers qui vivent en France.");
addStance("badinter", "mor", "Abolir : une justice qui ne tue pas", "Garde des Sceaux, il plaide le 17 septembre 1981 devant l’Assemblée pour l’abolition : l’État de droit ne doit pas donner la mort.");
addStance("mitterrand", "mor", "Abolir, malgré l’opinion", "Candidat en 1981, il se déclare contre la peine de mort alors qu’une majorité de Français y est encore favorable ; la loi d’abolition est votée quelques mois après son élection.");
addStance("jmlepen", "mor", "Rétablir la peine de mort", "Il réclame le rétablissement de la peine de mort, abolie en 1981.");
addStance("chirac", "mor", "Inscrire l’abolition dans la Constitution", "En 2007, il fait adopter par le Parlement réuni en Congrès l’interdiction de la peine de mort dans la Constitution (article 66-1).");
addStance("mlepen", "tv", "Privatiser France Télévisions et Radio France", "Candidate en 2022, elle veut supprimer la redevance et privatiser France Télévisions et Radio France, en préservant l’audiovisuel d’outre-mer et France Médias Monde.");
addStance("macron", "tv", "Supprimer la redevance, protéger l’indépendance", "Candidat en 2022, il s’engage à supprimer la redevance (138 euros par an), tout en affirmant son attachement à l’audiovisuel public et en proposant un budget pluriannuel pour garantir son indépendance. La redevance est supprimée en 2022.");
addStance("zemmour", "tv", "Supprimer la redevance, privatiser en partie", "Candidat en 2022, il annonce vouloir supprimer la redevance et privatiser une partie du service public audiovisuel.");
addStance("hidalgo", "tv", "Défendre la redevance pour l’indépendance du public", "En 2022, elle juge que supprimer la redevance, c’est affaiblir l’indépendance de l’audiovisuel public face aux concentrations médiatiques privées.");
addStance("giscard", "tv", "Éclater l’ORTF", "En 1974, l’ORTF est démantelé en plusieurs sociétés (TF1, Antenne 2, FR3, Radio France, TDF, SFP, INA) pour introduire de la concurrence entre chaînes publiques.");
addStance("mitterrand", "tv", "Mettre fin au monopole d’État", "En 1982, la loi sur la communication audiovisuelle consacre la liberté de communication, légalise les radios libres et crée une autorité de régulation.");
addStance("chirac", "tv", "Privatiser TF1", "Premier ministre de cohabitation, il fait privatiser TF1 en 1987.");
addStance("sarkozy", "tv", "Supprimer la pub le soir, nommer les patrons du public", "En 2009, il fait supprimer la publicité en soirée sur France Télévisions et confie au chef de l’État la nomination de son président.");
addStance("hollande", "tv", "Rendre la nomination des patrons du public au CSA", "En 2013, une loi supprime la nomination du président de France Télévisions par le chef de l’État et la confie au CSA, pour garantir l’indépendance du service public.");

const $ = s => document.querySelector(s);
const NB = "\u00a0";
const fr = s => String(s).replace(/« /g, "«" + NB).replace(/ »/g, NB + "»").replace(/ ([:;?!])/g, NB + "$1");
const esc = s => fr(String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"));
const attr = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const rand = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const byId = id => CANDS.find(c => c.id === id);
const initials = n => {
  const w = String(n).trim().split(/\s+/).filter(x => /^[A-ZÀ-ÖØ-Þ]/.test(x));
  if (!w.length) return "?";
  const f = w[0][0], l = w.length > 1 ? w[w.length - 1][0] : "";
  return (f + l).toUpperCase();
};

/* ============ LOGIQUE : DUELS ============ */
const hasFocus = c => !!(S.focus && c.s[S.focus]);
function pickOpp(p, w) {
  const pool = CANDS.filter(c => !S.taken.has(c.id) && !p.seen.includes(c.id));
  const samePt = (a, b) => a.pt === b.pt || (a.pt === "rn" && b.pt === "fn") || (a.pt === "fn" && b.pt === "rn");
  const pref = pool.filter(c => !samePt(c, w));
  const cross = pref.filter(c => c.era !== w.era);
  let list = (Math.random() < 0.65 && cross.length) ? cross : (pref.length ? pref : pool);
  if (S.focus && Math.random() < 0.7) {
    const f = list.filter(hasFocus);
    if (f.length) list = f; else { const f2 = pool.filter(hasFocus); if (f2.length) list = f2; }
  }
  return rand(list);
}
const curP = () => S.dp || S.players[S.cur];
function startDuels(p) {
  p.seen = [];
  const pool = CANDS.filter(c => !S.taken.has(c.id));
  const fp = pool.filter(hasFocus);
  const a = (S.focus && fp.length && Math.random() < 0.7) ? rand(fp) : rand(pool);
  p.seen.push(a.id);
  const b = pickOpp(p, a);
  p.seen.push(b.id);
  S.duel = Math.random() < 0.5 ? { n: 1, a: a.id, b: b.id, picked: null } : { n: 1, a: b.id, b: a.id, picked: null };
}
function pick(side) {
  const d = S.duel; if (!d || d.picked) return;
  d.picked = side;
  const w = byId(side === "a" ? d.a : d.b);
  document.querySelectorAll(".duel .pc").forEach(el => {
    el.classList.remove("won", "lost");
    el.classList.add(el.dataset.side === side ? "won" : "lost");
  });
  setTimeout(() => {
    const p = curP();
    if (d.n >= 10) {
      if (S.onFinal) { S.lastLoser = side === "a" ? d.b : d.a; S.onFinal(w); }
      else { p.cand = w.id; S.taken.add(w.id); go("card"); }
    } else {
      const o = pickOpp(p, w); p.seen.push(o.id);
      S.duel = Math.random() < 0.5 ? { n: d.n + 1, a: w.id, b: o.id, picked: null } : { n: d.n + 1, a: o.id, b: w.id, picked: null };
      render();
    }
  }, 620);
}

/* ============ LOGIQUE : MANCHES ============ */
function jokerText(c, k) {
  const t = THEMES[k], first = Object.values(c.s)[0];
  if (t && t.cat === "soc") return `Pas de position documentée de ${c.nom} sur ce sujet. Choisis le camp (le oui ou le non) qui te paraît le plus proche de ses valeurs, défends-le avec tes propres convictions, et dis clairement que tu extrapoles.`;
  return `Pas de position précise de ${c.nom} sur ce sujet dans notre base. Imagine ce qu’il défendrait d’après son parcours (par exemple : « ${first[0]} ») et dis clairement que tu extrapoles.`;
}
const modeNow = () => S.online ? (O.s.settings.mode || "random") : S.mode;
const themesNow = () => S.online ? (O.s.settings.themes || []) : S.picked;
function planRound(idx) {
  const live = S.players.filter(p => p.cand);
  if (modeNow() === "theme") { const l = themesNow(); return { theme: l[Math.min(idx, l.length - 1)] }; }
  const used = S.online ? (O.s.used || []) : S.usedThemes;
  const cs = live.map(p => byId(p.cand));
  const avail = Object.keys(THEMES).filter(k => THEMES[k].cat === "grand" && !used.includes(k));
  const sc = avail.map(k => {
    const have = cs.filter(c => c.s[k]);
    return { k, cov: have.length, mix: new Set(have.map(c => c.era)).size > 1 ? 1 : 0, r: Math.random() };
  }).sort((a, b) => b.cov - a.cov || b.mix - a.mix || b.r - a.r);
  return { theme: sc[0].k };
}
function makeHands() {
  return S.players.map(p => { const c = byId(p.cand); const st = c ? (c.s[S.theme] || null) : null; return { cand: p.cand, st, joker: (c && !st) ? jokerText(c, S.theme) : null }; });
}
function setupRound() {
  const r = planRound(S.round);
  S.theme = r.theme; S.usedThemes.push(S.theme);
  S.hands = makeHands();
  S.deb = newDeb(S.players.map(p => p.id), S.minutes * 60);
}

/* ============ DÉBAT : TEMPS DE PAROLE (comme à la télé) ============ */
const T = { ctx: null, beeped: null };
const stopTimer = () => { };
const nowS = () => Date.now() + ((S.online && O.s) ? O.off : 0);
const curDeb = () => S.online ? (O.s && O.s.deb) : S.deb;
function newDeb(ids, sec) {
  const banks = {}; ids.forEach(id => banks[id] = sec);
  return { banks, total: sec, floor: null, running: false, at: Date.now(), prompt: null };
}
function debLeft(D, id, now) { let b = D.banks[id] || 0; if (D.running && D.floor === id) b -= (now - D.at) / 1000; return Math.max(0, b); }
function debSettle(D, now) { if (D.running && D.floor != null) D.banks[D.floor] = debLeft(D, D.floor, now); D.at = now; }
function debSpeak(D, id, now) { debSettle(D, now); D.floor = id; D.running = (D.banks[id] || 0) > 0; D.at = now; }
function debPause(D, now) { debSettle(D, now); D.running = false; }
function debResume(D, now) { debSettle(D, now); D.running = D.floor != null && (D.banks[D.floor] || 0) > 0; D.at = now; }
function relancePool() { const t = THEMES[S.theme] || {}; return (t.relances || []).concat(GENERIC_RELANCES); }
function beep() {
  try {
    T.ctx = T.ctx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22, 0.44].forEach(d => {
      const o = T.ctx.createOscillator(), g = T.ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(T.ctx.destination);
      g.gain.setValueAtTime(0.0001, T.ctx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(0.25, T.ctx.currentTime + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, T.ctx.currentTime + d + 0.18);
      o.start(T.ctx.currentTime + d); o.stop(T.ctx.currentTime + d + 0.2);
    });
  } catch (e) { }
  try { if (navigator.vibrate) navigator.vibrate([180, 80, 180]); } catch (e) { }
}
function paintDeb() {
  if (S.screen !== "debate") return;
  const D = curDeb(); if (!D) return;
  const now = nowS();
  let anyLeft = false;
  S.players.forEach(p => {
    const left = debLeft(D, p.id, now);
    if (left > 0) anyLeft = true;
    const t = document.getElementById("bk-" + p.id); if (t) t.textContent = fmt(left);
    const bar = document.getElementById("bb-" + p.id); if (bar) bar.style.width = (100 * left / (D.total || 1)).toFixed(1) + "%";
    const chip = document.getElementById("ch-" + p.id);
    if (chip) { chip.classList.toggle("zero", left <= 0); chip.classList.toggle("live", D.floor === p.id); chip.classList.toggle("run", D.floor === p.id && D.running); }
  });
  const fl = D.floor, left = fl ? debLeft(D, fl, now) : 0;
  const num = $("#dnum"); if (!num) return;
  num.textContent = fl ? fmt(left) : "—";
  $("#dring").style.strokeDashoffset = (326.7 * (1 - (fl ? left / (D.total || 1) : 0))).toFixed(1);
  const dock = $("#dock");
  dock.classList.toggle("run", !!(fl && D.running && left > 0));
  dock.classList.toggle("done", !!(fl && left <= 0));
  $("#dlabel").textContent = !fl ? "Libre" : (left <= 0 ? "Épuisé" : (D.running ? "En cours" : "Pause"));
  const ad = $("#alldone"); if (ad) ad.hidden = anyLeft;
  const key = fl + ":" + D.at;
  if (fl && D.running && left <= 0 && T.beeped !== key) { T.beeped = key; beep(); }
}
setInterval(paintDeb, 250);
function debAct(kind, id) {
  if (S.online) {
    if (kind === "speak") osend({ t: "speak" });
    else if (kind === "give") osend({ t: "give", pid: id });
    else if (kind === "pause") osend({ t: "pause" });
    else if (kind === "resume") osend({ t: "resume" });
    else if (kind === "relance") osend({ t: "relance", i: Math.floor(Math.random() * relancePool().length) });
    return;
  }
  const D = S.deb, now = Date.now();
  if (kind === "give") debSpeak(D, id, now);
  else if (kind === "pause") debPause(D, now);
  else if (kind === "resume") debResume(D, now);
  else if (kind === "relance") D.prompt = { i: Math.floor(Math.random() * relancePool().length), n: ((D.prompt && D.prompt.n) || 0) + 1 };
  render(true);
}

      ? `<span class="lbl">Nombre de manches</span>${segHTML([[1, "1 manche"], [2, "2 manches"], [3, "3 manches"]], S.rounds, "setRounds")}`
      : `<p class="hint">Choisis 1 à 3 sujets : un par manche, dans l’ordre où tu les touches. Les débats de société ne demandent aucune connaissance particulière.</p>${themePickerHTML(S.picked, "togglePick")}`}
    <span class="lbl">Temps de parole par joueur</span>${segHTML(MINUTES.map(m => [m, m + " min"]), S.minutes, "setMinutes")}
    <p class="hint">Comme à la télé : chaque joueur dispose de ${S.minutes} minutes de parole <b>en tout</b>, qu’il utilise quand il veut. Le chrono se met en pause et reprend.</p>
    ${S.setupErr ? `<p class="err">${esc(S.setupErr)}</p>` : ""}
    <div class="row mt"><button class="btn primary big" data-act="start">Lancer la partie →</button><button class="btn ghost" data-act="home">Retour</button></div>
  </div></section>`;
}

function viewPass(kind) {
  const isVote = kind === "vote";
  const p = S.players[isVote ? S.vote.i : S.cur];
  return `<section class="scr pass"><div class="box">
    <div class="bubble">${isVote ? "🗳️" : "📱"}</div>
    <div class="kicker">${isVote ? "Le vote" : "Les duels"}</div>
    <h2>Passe le téléphone à <em>${esc(p.name)}</em></h2>
    <p class="lead" style="margin:0 auto 22px">${isVote ? "Ton vote est secret. Tu désignes le meilleur débatteur, mais pas toi-même." : "Dix duels t’attendent. Le vainqueur de chaque duel reste en piste : le dernier devient ton candidat."}</p>
    <button class="btn primary big" data-act="${isVote ? "voteReady" : "ready"}">${isVote ? "Je vote" : "Je suis prêt·e"}</button>
  </div></section>`;
}

function viewDuel() {
  const p = curP(), d = S.duel;
  const pips = Array.from({ length: 10 }, (_, i) => `<i class="${i < d.n - 1 ? "d" : (i === d.n - 1 ? "n" : "")}"></i>`).join("");
  const mk = (id, side) => {
    const c = byId(id);
    return cardHTML(c, { tag: "div", bio: true, cls: "big-click", attrs: `role="button" tabindex="0" data-act="pick" data-side="${side}" aria-label="Choisir ${attr(c.nom)}"` });
  };
  return `<section class="scr">
    <div class="dhead"><div><div class="kicker">${esc(p.name)} · duel ${d.n} sur 10</div><h2>Tu préfères…</h2></div><span class="pill">${d.n === 10 ? "Duel final" : "Le vainqueur reste en piste"}</span></div>
    <div class="pips">${pips}</div>
    ${S.online ? `<p class="hint" id="oprog" style="margin:-8px 0 12px"></p>` : ""}
    ${S.tiebreak ? `<div class="fact" style="margin:0 0 14px"><b>Duel de départage</b>Un autre joueur a déjà choisi ce candidat. Dernier duel pour trouver le tien !</div>` : ""}
    <div class="duel">${mk(d.a, "a")}<div class="vs">VS</div>${mk(d.b, "b")}</div>
    <p class="choose">Touche la carte que tu préfères.</p>
  </section>`;
}

function viewCard() {
  const p = S.players[S.cur], c = byId(p.cand);
  const ideas = Object.entries(c.s).map(([k, v]) => `<div class="idea"><div class="ic">${THEMES[k].ico}</div><div><b>${esc(v[0])}</b><span>${esc(THEMES[k].nom)}</span></div></div>`).join("");
  const last = S.cur === S.players.length - 1;
  return `<section class="scr">
    <div class="dhead"><div><div class="kicker">${esc(p.name)} · ta carte</div><h2>Voici ton candidat</h2></div></div>
    <div class="reveal">${cardHTML(c, { cls: "big", bio: true })}
      <div>
        <p class="lead">Pendant le débat, tu parleras à la place de ${esc(c.nom)}.</p>
        <h3 style="margin:20px 0 4px">Ses grandes idées</h3>
        <p class="muted">Selon le sujet du débat, tu défendras l’une d’elles${Object.keys(c.s).length < 4 ? ". Si le sujet n’est pas documenté pour lui, tu recevras une carte Joker" : ""}.</p>
        <div class="ideas">${ideas}</div>
        <div class="row mt"><button class="btn primary big" data-act="cardNext">${last ? "Découvrir le sujet du débat →" : "Joueur suivant →"}</button></div>
      </div>
    </div></section>`;
}

function campsHTML(t) {
  return `<div class="camps2"><div><h4>👍 Pour</h4><ul>${t.pour.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><div><h4>👎 Contre</h4><ul>${t.contre.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>`;
}
function viewTheme() {
  const t = THEMES[S.theme], soc = t.cat === "soc";
  const doc = S.hands.filter(h => h.st).length;
  const rows = S.players.map((p, i) => {
    const c = byId(S.hands[i].cand), pt = PARTIES[c.pt];
    return `<div class="vopt" style="--c1:${pt.c1};--c2:${pt.c2};cursor:default"><div class="mono">${initials(p.name)}</div><div><b>${esc(p.name)}</b><span>${esc(c.nom)} · ${esc(c.pl || pt.nom)}</span></div></div>`;
  }).join("");
  return `<section class="scr">
    <div class="dhead"><div class="kicker">Manche ${S.round + 1} sur ${S.rounds}</div></div>
    <div class="theme-hero"><div class="ico">${t.ico}</div><div class="kicker" style="color:#ff9aa3">Sujet du débat</div><h2>${esc(t.q)}</h2><p>${esc(t.ctx)}</p>
      ${soc ? `<div class="chips"><span class="chip">Aucune connaissance particulière requise</span><span class="chip">Débat de convictions</span></div>${campsHTML(t)}` : `<div class="chips">${t.axes.map(a => `<span class="chip">${esc(a)}</span>`).join("")}</div>`}</div>
    <div class="panel mt"><h2>Les ${S.players.length} débatteurs</h2>
      <p class="muted">${doc === 0 ? "Aucun candidat n’a de position documentée dans notre base sur ce sujet : tout le monde reçoit une carte Joker et choisit son camp." : doc + " candidat" + (doc > 1 ? "s ont" : " a") + " une position documentée sur ce sujet" + (doc < S.players.length ? " ; les autres reçoivent une carte Joker et choisissent leur camp" : "") + "."} Chaque joueur dispose de ${Math.round(((curDeb() && curDeb().total) || S.minutes * 60) / 60)} minutes de parole en tout.</p>
      <div class="vlist">${rows}</div></div>
    ${(!S.online || isHost()) ? `<div class="row mt"><button class="btn primary big" data-act="beginRound">Distribuer les idées →</button></div>` : `<p class="muted mt">⏳ L’hôte va distribuer les idées…</p>`}
  </section>`;
}

function dcHTML(h, i, D) {
  const c = byId(h.cand), p = PARTIES[c.pt], pl = S.players[i], t = THEMES[S.theme];
  const sp = D && D.floor === pl.id;
  const mine = S.online && i === S.me;
  const extra = t.cat === "soc"
    ? `<div class="pc2"><span class="pcy">Pour</span>${esc(t.pour[0])}</div><div class="pc2"><span class="pcn">Contre</span>${esc(t.contre[0])}</div>`
    : `<div class="axes">${t.axes.slice(0, 3).map(a => `<span>${esc(a)}</span>`).join("")}</div>`;
  const body = h.st
    ? `<h4>${esc(h.st[0])}</h4><p>${esc(h.st[1])}</p>`
    : `<span class="joker">Carte Joker</span><h4>Défends l’esprit de ${esc(c.nom)}</h4><p>${esc(h.joker)}</p>${extra}`;
  return `<article class="dc ${sp ? "speaking" : ""} ${mine ? "mine" : ""}" style="--c1:${p.c1};--c2:${p.c2}">
    <div class="dc-top">${emblem(p.em, "#fff", p.c1)}<div><b>${esc(c.nom)}</b><small>${esc(c.pl || p.nom)}</small></div><span class="dc-who">${esc(pl.name)}${mine ? " (toi)" : ""}</span></div>
    <div class="dc-body">${body}${sp ? '<span class="tg">À toi de parler</span>' : ""}</div>
  </article>`;
}

function viewDebate() {
  const t = THEMES[S.theme], D = curDeb(), host = !S.online || isHost();
  const myId = S.online ? O.pid : null, now = nowS();
  const fl = D.floor, flIdx = S.players.findIndex(p => p.id === fl);
  const flLeft = fl ? debLeft(D, fl, now) : 0;
  const order = S.hands.map((_, i) => i).sort((a, b) => (b === S.me ? 1 : 0) - (a === S.me ? 1 : 0));
  const chips = S.players.map((p, i) => {
    const c = byId(S.hands[i].cand), pt = PARTIES[c.pt], mine = S.online && p.id === myId;
    const tappable = !S.online || mine || host;
    return `<div class="chip2 ${mine ? "mine" : ""}" id="ch-${p.id}" style="--c1:${pt.c1};--c2:${pt.c2}" ${tappable ? `role="button" tabindex="0" data-act="dGive" data-id="${p.id}"` : ""}><div class="mono">${initials(p.name)}</div><div class="ct"><b>${esc(p.name)}${mine ? " (toi)" : ""}</b><span id="bk-${p.id}">0:00</span><div class="bar2"><i id="bb-${p.id}"></i></div></div></div>`;
  }).join("");
  const pool = relancePool();
  const prompt = D.prompt ? pool[D.prompt.i % pool.length] : null;
  let st, who, hint;
  if (fl == null) { st = "Débat libre"; who = "Qui prend la parole ?"; hint = S.online ? "Appuie sur « Je prends la parole » quand tu veux intervenir." : "Touche le nom d’un joueur pour lancer son chrono."; }
  else { st = flLeft <= 0 ? "Temps épuisé" : (D.running ? "Il parle" : "En pause"); who = `${esc(S.players[flIdx].name)} · ${esc(byId(S.hands[flIdx].cand).nom)}`; hint = flLeft <= 0 ? "Son temps de parole est écoulé : à quelqu’un d’autre !" : (D.running ? "Son chrono tourne." : "Le chrono est en pause."); }
  let btns = "";
  if (S.online) {
    const meSpeaking = fl === myId && D.running;
    btns = meSpeaking ? `<button class="btn primary" data-act="dPause">✋ Rendre la parole</button>` : `<button class="btn primary" data-act="dSpeak">🎤 Je prends la parole</button>`;
    if (host) btns += `${fl && !meSpeaking ? `<button class="btn" data-act="dToggle">${D.running ? "⏸ Pause" : "▶ Reprendre"}</button>` : ""}<button class="btn" data-act="dRelance" aria-label="Lancer une relance">💬</button><button class="btn" data-act="dEnd">Vote →</button>`;
  } else {
    btns = `<button class="btn primary" data-act="dToggle" ${fl ? "" : "disabled"}>${D.running ? "⏸ Pause" : "▶ Reprendre"}</button><button class="btn" data-act="dRelance">💬 Relance</button><button class="btn" data-act="dEnd">Vote →</button>`;
  }
  return `<section class="scr">
    <div class="kicker">Manche ${S.round + 1} sur ${S.rounds} · ${t.ico} ${esc(t.nom)}</div>
    <h2 style="font-size:clamp(1.4rem,4vw,2.1rem);margin-top:4px">${esc(t.q)}</h2>
    <details class="camps"><summary>${t.cat === "soc" ? "Les arguments des deux camps" : "Le contexte du sujet"}</summary>${t.cat === "soc" ? campsHTML(t) : `<p class="muted" style="margin-top:8px">${esc(t.ctx)}</p>`}</details>
    <div class="timebank"><div class="tb-h"><b>⏱ Temps de parole</b><span>${Math.round(D.total / 60)} min chacun · ${S.online ? (host ? "touche un joueur pour lui donner la parole" : "touche ton nom pour parler") : "touche un joueur pour lancer son chrono"}</span></div><div class="chips2">${chips}</div></div>
    ${prompt ? `<div class="relance"><b>💬 Relance</b>${esc(prompt)}</div>` : ""}
    <div class="alldone" id="alldone" hidden>⏱ Le temps de parole de tous les joueurs est écoulé : passez au vote.</div>
    <div class="board">${order.map(i => dcHTML(S.hands[i], i, D)).join("")}</div>
    <div class="dock" id="dock"><div class="dock-in">
      <div class="ring">
        <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52" fill="none" stroke-width="9"/><circle class="fg" id="dring" cx="60" cy="60" r="52" fill="none" stroke-width="9" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
        <div class="num"><div><span id="dnum">—</span><small id="dlabel">Libre</small></div></div>
      </div>
      <div class="dock-txt"><div class="st">${st}</div><div class="who">${who}</div><div class="h">${hint}</div></div>
      <div class="row">${btns}</div>
    </div></div>
  </section>`;
}

function viewVote() {
  const i = S.vote.i, sel = S.vote.sel;
  const opts = S.players.map((_, j) => j).filter(j => j !== i).map(j => {
    const q = S.players[j], c = byId(S.hands[j].cand), pt = PARTIES[c.pt];
    return `<button class="vopt ${sel === j ? "on" : ""}" style="--c1:${pt.c1};--c2:${pt.c2}" data-act="selVote" data-j="${j}">
      <div class="mono">${initials(q.name)}</div>
      <div><b>${esc(q.name)}</b><span>${esc(c.nom)} · ${esc(S.hands[j].st ? S.hands[j].st[0] : "Carte Joker")}</span></div>
      <div class="ck">${sel === j ? "✓" : ""}</div></button>`;
  }).join("");
  return `<section class="scr">
    <div class="kicker">${S.online ? "Manche " + (S.round + 1) + " sur " + S.rounds + " · ton vote" : esc(S.players[i].name) + " · vote " + (i + 1) + " sur " + S.players.length}</div>
    <h2 style="font-size:clamp(1.8rem,5vw,2.6rem)">Qui a gagné le débat ?</h2>
    <p class="muted">Vote pour le débatteur le plus convaincant, pas pour le candidat que tu préfères. Tu ne peux pas voter pour toi-même.</p>
    <div class="vlist">${opts}</div>
    <div class="row mt"><button class="btn primary big" data-act="confirmVote" ${sel == null ? "disabled" : ""}>Valider mon vote</button></div>
  </section>`;
}

function rankRows(counts, maxV) {
  const order = S.players.map((p, i) => ({ p, i, c: counts[i] })).sort((a, b) => b.c - a.c || a.p.name.localeCompare(b.p.name));
  let rk = 0, prev = null;
  return order.map((o, idx) => {
    if (o.c !== prev) { rk = idx + 1; prev = o.c; }
    const top = order[0].c;
    const win = o.c === top && top > 0;
    const c = byId(S.hands[o.i] ? S.hands[o.i].cand : o.p.cand), pt = PARTIES[c.pt];
    const w = maxV ? Math.max(4, Math.round(100 * o.c / maxV)) : 4;
    return `<div class="prow ${win ? "win" : ""}" style="--c1:${pt.c1};--c2:${pt.c2}">
      ${win ? '<span class="crown">👑</span>' : ""}
      <div class="rank">${rk}</div>
      <div><div class="nm">${esc(o.p.name)}</div><div class="cn">${esc(c.nom)}</div><div class="bar"><i style="width:${w}%"></i></div></div>
      <div class="sc">${o.c}<small>vote${o.c > 1 ? "s" : ""}</small></div></div>`;
  }).join("");
}

function viewResults() {
  const r = S.results[S.round], t = THEMES[S.theme], lastR = S.round === S.rounds - 1;
  const top = Math.max.apply(null, r.counts);
  const wins = S.players.filter((_, i) => r.counts[i] === top).map(p => p.name);
  const title = wins.length === 1 ? `${esc(wins[0])} remporte le débat !` : `Égalité entre ${wins.map(esc).join(" et ")} !`;
  return `<section class="scr">
    <div class="kicker">Manche ${S.round + 1} sur ${S.rounds} · résultats</div>
    <h2 style="font-size:clamp(1.9rem,5.5vw,3rem)">${title}</h2>
    <p class="muted">${t.ico} ${esc(t.q)}</p>
    <div class="podium">${rankRows(r.counts, S.players.length - 1)}</div>
    <div class="fact"><b>Le saviez-vous ?</b>${esc(t.fait)}</div>
    ${(S.online && !isHost()) ? `<p class="muted mt">⏳ L’hôte lance la suite…</p>` : `<div class="row mt">${lastR
      ? (S.rounds > 1 ? `<button class="btn primary big" data-act="final">Classement final →</button>` : `<button class="btn primary big" data-act="rematch">Rejouer avec les mêmes joueurs</button><button class="btn" data-act="home">Menu</button>`)
      : `<button class="btn primary big" data-act="nextRound">Manche suivante →</button>`}</div>`}
  </section>`;
}

function viewFinal() {
  const tot = S.players.map(p => p.total);
  const maxV = Math.max.apply(null, tot) || 1;
  const top = Math.max.apply(null, tot);
  const wins = S.players.filter(p => p.total === top).map(p => p.name);
  return `<section class="scr">
    <div class="kicker">Classement final · ${S.rounds} manches</div>
    <h2 style="font-size:clamp(1.9rem,5.5vw,3rem)">${wins.length === 1 ? `${esc(wins[0])} est élu·e président·e du débat !` : `Égalité au sommet : ${wins.map(esc).join(" et ")}`}</h2>
    <div class="podium">${rankRows(tot, maxV)}</div>
    ${(S.online && !isHost()) ? `<p class="muted mt">⏳ L’hôte peut lancer une revanche.</p><div class="row mt"><button class="btn" data-act="home">Quitter la salle</button></div>` : `<div class="row mt"><button class="btn primary big" data-act="rematch">Revanche</button><button class="btn" data-act="home">${S.online ? "Quitter la salle" : "Menu"}</button></div>`}
  </section>`;
}

/* ============ MODALES ============ */
const tlHTML = rows => `<ol class="tl">${rows.map(([y, f]) => `<li><b>${esc(y)}</b><span>${esc(f)}</span></li>`).join("")}</ol>`;
function modalHTML() {
  const m = S.modal; if (!m) return "";
  const X = `<button class="iconbtn x" data-act="closeModal" aria-label="Fermer">✕</button>`;
  let inner = "";
  if (m.type === "how") {
    inner = `${X}<h2>Comment jouer</h2>
    <ol>
      <li><b>De 4 à 8 joueurs</b>, sur un seul téléphone ou chacun sur le sien (créez une salle et partagez le lien).</li>
      <li><b>Dix duels</b> « Tu préfères… » par joueur. Le vainqueur d’un duel affronte un nouveau personnage ; le dernier gagnant devient ton candidat. Deux joueurs n’ont jamais le même.</li>
      <li><b>Le sujet</b> est tiré au hasard parmi les grands sujets de la Ve République, ou <b>choisi par vous</b> (nucléaire, réseaux sociaux, fin de vie, cannabis…). Chacun reçoit l’idée que son candidat a réellement défendue, ou une carte Joker : dans ce cas, tu choisis ton camp et tu le dis clairement.</li>
      <li><b>Le débat est libre, comme à la télé</b> : chaque joueur dispose de 5, 10 ou 15 minutes de parole en tout. Son chrono tourne quand il parle, et on peut mettre en pause et reprendre. Une relance peut vous aider à dialoguer.</li>
      <li><b>Chacun vote en secret</b> pour le meilleur débatteur, pas pour lui-même.</li>
    </ol>
    <p class="muted" style="font-size:.88rem">Les idées s’appuient sur des faits publics : lois, discours, programmes, vérifiés à la date d’octobre 2026. Les positions des candidats de 2027 peuvent évoluer ; en cas de doute, consultez leurs programmes officiels. Les emblèmes sont des dessins stylisés, pas des logos officiels.</p>
    <div class="row mt"><button class="btn primary" data-act="closeModal">Compris</button></div>`;
  } else if (m.type === "quit") {
    inner = `<h2>Quitter la partie ?</h2><p class="muted">Les duels et le débat en cours seront perdus.</p><div class="row mt"><button class="btn primary" data-act="confirmQuit">Quitter</button><button class="btn" data-act="closeModal">Continuer</button></div>`;
  } else if (m.type === "cand") {
    const c = byId(m.id);
    const lines = Object.entries(c.s).map(([k, v]) => `<div class="dline"><div class="ic">${THEMES[k].ico}</div><div><div class="tn">${esc(THEMES[k].nom)}</div><b>${esc(v[0])}</b><p>${esc(v[1])}</p></div></div>`).join("");
    inner = `${X}${cardHTML(c, { cls: "mini", bio: true })}
      ${c.rep ? `<h3 style="margin:18px 0 6px">Repères</h3>${tlHTML(c.rep)}` : ""}
      <h3 style="margin:18px 0 0">Ses positions documentées (${Object.keys(c.s).length})</h3>${lines}`;
  } else if (m.type === "dossier") {
    const k = m.id, t = THEMES[k];
    const who = CANDS.filter(c => c.s[k]);
    const rows = who.map(c => { const pt = PARTIES[c.pt]; return `<div class="vopt click" style="--c1:${pt.c1};--c2:${pt.c2}" role="button" tabindex="0" data-act="openCand" data-id="${c.id}"><div class="mono">${initials(c.nom)}</div><div><b>${esc(c.nom)}</b><span>${esc(c.s[k][0])}</span></div></div>`; }).join("");
    inner = `${X}<div class="kicker">${t.cat === "soc" ? "Débat de société" : "Grand sujet"}</div><h2>${t.ico} ${esc(t.nom)}</h2>
      <p style="font-family:var(--serif);font-size:1.15rem;font-weight:700;margin:6px 0">${esc(t.q)}</p>
      <h3 style="margin:14px 0 4px">Le contexte</h3><p class="muted">${esc(t.ctx)}</p>
      ${t.cat === "soc" ? `<h3 style="margin:14px 0 4px">Les deux camps</h3>${campsHTML(t)}` : ""}
      <h3 style="margin:16px 0 6px">Chronologie</h3>${tlHTML(t.chrono)}
      <div class="fact"><b>Le saviez-vous ?</b>${esc(t.fait)}</div>
      <h3 style="margin:16px 0 0">Qui a pris position (${who.length})</h3><div class="vlist">${rows}</div>`;
  }
  return `<div class="modal" data-act="closeModalBg"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;
}

/* ============ RENDU ============ */
const INGAME = ["passDuel", "duel", "card", "theme", "debate", "passVote", "vote", "results", "final"];
function render(noAnim) {
  let v = "";
  switch (S.screen) {
    case "home": v = viewHome(); break;
    case "gallery": v = viewGallery(); break;
    case "setup": v = viewSetup(); break;
    case "passDuel": v = viewPass("duel"); break;
    case "duel": v = viewDuel(); break;
    case "card": v = viewCard(); break;
    case "theme": v = viewTheme(); break;
    case "debate": v = viewDebate(); break;
    case "passVote": v = viewPass("vote"); break;
    case "vote": v = viewVote(); break;
    case "results": v = viewResults(); break;

function resetPlayers() {
  S.players = S.players.map(p => ({ id: p.id, name: p.name, cand: null, seen: [], total: 0 }));

}
const A = {
  brand() { if (INGAME.includes(S.screen)) A.quit(); else A.home(); },
  home() { stopTimer(); S.modal = null; if (S.online) { onlineLeave(); return; } go("home"); },
  gallery() { go("gallery"); },
  how() { S.modal = { type: "how" }; render(); },
  closeModal() { S.modal = null; render(); },
  closeModalBg(d, el, e) { if (e.target === el) { S.modal = null; render(); } },
  quit() { S.modal = { type: "quit" }; render(); },
  confirmQuit() { stopTimer(); S.modal = null; if (S.online) { onlineLeave(); return; } go("home"); },
  openCand(d) { S.modal = { type: "cand", id: d.id }; render(); },

  setN(d) { S.n = +d.v; render(true); },
  setRounds(d) { S.rounds = +d.v; render(true); },
  setMinutes(d) { S.minutes = +d.v; render(true); },
  setMode(d) { S.mode = d.v; S.setupErr = ""; render(true); },
  togglePick(d) {
    const i = S.picked.indexOf(d.k);
    if (i >= 0) S.picked.splice(i, 1); else if (S.picked.length < 3) S.picked.push(d.k);
    S.setupErr = ""; render(true);
  },
  start() {
    if (S.mode === "theme" && !S.picked.length) { S.setupErr = "Choisis au moins un sujet de débat."; render(true); return; }
    S.setupErr = "";
    const seen = new Set();
    const names = [];
    for (let i = 0; i < S.n; i++) {
      let nm = (S.names[i] || "").trim() || ("Joueur " + (i + 1));
      let base = nm, k = 2;
      while (seen.has(nm.toLowerCase())) nm = base + " " + (k++);
      seen.add(nm.toLowerCase()); names.push(nm);
    }
    S.names = names;
    S.players = names.map((n, i) => ({ id: "p" + i, name: n, cand: null, seen: [], total: 0 }));
    S.taken = new Set(); S.cur = 0; S.round = 0; S.usedThemes = []; S.results = [];
    if (S.mode === "theme") S.rounds = S.picked.length;
    S.focus = S.mode === "theme" ? S.picked[0] : null;
    go("passDuel");
  },
  ready() { startDuels(S.players[S.cur]); go("duel"); },
  pick(d) { pick(d.side); },
  cardNext() {
    if (S.cur < S.players.length - 1) { S.cur++; go("passDuel"); }
    else { S.round = 0; setupRound(); go("theme"); }
  },
  beginRound() { if (S.online) { osend({ t: "beginDebate" }); return; } if (S.deb) S.deb.at = Date.now(); go("debate"); },
  dGive(d) {
    if (S.online) { if (d.id === O.pid) debAct("speak"); else if (isHost()) debAct("give", d.id); return; }
    debAct("give", d.id);
  },
  dSpeak() { debAct("speak"); },
  dPause() { debAct("pause"); },
  dToggle() { const D = curDeb(); debAct(D.running ? "pause" : "resume"); },
  dRelance() { debAct("relance"); },
  dEnd() {
    if (S.online) { osend({ t: "toVote" }); return; }
    debPause(S.deb, Date.now());
    S.vote = { i: 0, sel: null, picks: [] }; go("passVote");
  },
  voteReady() { go("vote"); },
  selVote(d) { S.vote.sel = +d.j; render(true); },
  confirmVote() {
    if (S.online) { if (S.vote.sel == null) return; const tg = S.players[S.vote.sel]; S.vote.sel = null; osend({ t: "vote", target: tg.id }); return; }
    const v = S.vote; if (v.sel == null) return;
    v.picks[v.i] = v.sel; v.sel = null;
    if (v.i < S.players.length - 1) { v.i++; go("passVote"); }
    else {
      const counts = S.players.map(() => 0);
      v.picks.forEach(j => counts[j]++);
      S.results[S.round] = { counts };
      S.players.forEach((p, i) => p.total += counts[i]);
      go("results");
    }
  },
  nextRound() { if (S.online) { onlineStartRound(); return; } S.round++; setupRound(); go("theme"); },
  final() { if (S.online) { osend({ t: "final" }); return; } go("final"); },
  rematch() { if (S.online) { osend({ t: "rematch" }); return; } resetPlayers(); go("passDuel"); }
};

/* ============ MODE EN LIGNE (chacun son téléphone) ============ */
const O = { ws: null, code: null, pid: null, token: null, s: null, off: 0, name: "", codeIn: "", err: "", busy: false, retry: 0, beeped: null };
const SKEY = "grandDebat.session";
const PAL = ["#2147a6", "#d62f4c", "#33a853", "#f08a24", "#7a49c4", "#1c93c9", "#e8457e", "#139287"];
const palOf = i => { const c = PAL[i % PAL.length]; return `--c1:${c};--c2:${c}`; };

function saveSession() { try { sessionStorage.setItem(SKEY, JSON.stringify({ code: O.code, pid: O.pid, token: O.token, name: O.name })); } catch (e) { } }
function loadSession() { try { return JSON.parse(sessionStorage.getItem(SKEY) || "null"); } catch (e) { return null; } }
function clearSession() { try { sessionStorage.removeItem(SKEY); } catch (e) { } }
function wsURL() { return (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"; }
function osend(m) { if (O.ws && O.ws.readyState === 1) { O.ws.send(JSON.stringify(m)); return true; } return false; }
const isHost = () => !!(O.s && O.s.host === O.pid);

function toast(msg) {
  const t = $("#toast"); if (!t) return;
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 3500);
}
function setConn(ok) { const c = $("#conn"); if (c) c.classList.toggle("on", !ok); }

function oconnect() {
  return new Promise((resolve, reject) => {
    let ws; try { ws = new WebSocket(wsURL()); } catch (e) { reject(e); return; }
    O.ws = ws; let opened = false;
    ws.onopen = () => { opened = true; O.retry = 0; setConn(true); resolve(); };
    ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } onMsg(m); };
    ws.onclose = () => {
      if (O.ws !== ws) return;
      if (!opened) { reject(new Error("close")); return; }
      if (O.pid) { setConn(false); oreconnect(); }
    };
    ws.onerror = () => { };
  });
}
function oreconnect() {
  if (!O.pid) return;
  const d = Math.min(8000, 700 * Math.pow(1.6, O.retry++));
  setTimeout(() => {
    if (!O.pid) return;
    oconnect().then(() => osend({ t: "rejoin", code: O.code, pid: O.pid, token: O.token })).catch(() => oreconnect());
  }, d);
}
function resetOnline() {
  O.pid = null; O.code = null; O.token = null; O.s = null; O.busy = false;
  S.online = false; S.onFinal = null; S.dp = null; S.tiebreak = false; S.me = -1;
  stopTimer();
}
function onlineLeave() {
  osend({ t: "leave" }); clearSession();
  const ws = O.ws; resetOnline();
  try { if (ws) ws.close(); } catch (e) { }
  go("home");
}

function onMsg(m) {
  if (m.t === "joined") {
    O.code = m.code; O.pid = m.pid; O.token = m.token; O.busy = false; O.err = ""; saveSession(); S.online = true;
  } else if (m.t === "state") {
    onState(m.s);
  } else if (m.t === "error") {
    O.busy = false;
    if (m.fatal) { clearSession(); resetOnline(); O.err = m.msg; go("o-menu"); }
    else { O.err = m.msg; if (S.screen === "o-menu") render(true); else toast(m.msg); }
  } else if (m.t === "conflict") {
    onConflict(m.taken);
  }
}

/* ----- miroir de l’état serveur dans S (pour réutiliser les vues existantes) ----- */
function mirror() {
  const s = O.s; if (!s) return;
  S.me = s.players.findIndex(p => p.id === O.pid);
  S.rounds = s.settings.rounds; S.minutes = s.settings.minutes; S.mode = s.settings.mode; S.picked = s.settings.themes || [];
  S.focus = s.settings.mode === "theme" ? (s.settings.themes || [])[0] || null : null;
  S.round = s.round;
  S.players = s.players.map(p => ({ id: p.id, name: p.name, cand: p.cand, total: s.totals[p.id] || 0 }));
  S.taken = new Set(s.taken);
  S.theme = s.theme;
  S.hands = (s.theme && THEMES[s.theme]) ? makeHands() : [];
  S.results = s.results.map(r => ({ counts: s.players.map(p => r.counts[p.id] || 0) }));
}

function onState(s) {
  O.s = s; O.off = s.now - Date.now();
  mirror(); route();
}
function route() {
  const s = O.s, me = s.players.find(p => p.id === O.pid);
  if (!me) { resetOnline(); O.err = "Tu n’es plus dans cette salle."; go("o-menu"); return; }
  let t = "o-lobby";
  switch (s.phase) {
    case "lobby": t = "o-lobby"; break;
    case "duels": t = me.cand ? "o-card" : (["duel", "o-duelintro", "o-pickwait"].includes(S.screen) ? S.screen : "o-duelintro"); break;
    case "theme": t = "theme"; break;
    case "debate": t = "debate"; break;
    case "vote": t = s.voted.includes(O.pid) ? "o-votewait" : "o-vote"; break;
    case "results": t = "results"; break;
    case "final": t = "final"; break;
  }
  if (t === "o-vote" && S.screen !== "o-vote") S.vote = { i: S.me, sel: null, picks: [] };
  if (t === "o-card") S.tiebreak = false;
  if (t !== S.screen) { S.screen = t; window.scrollTo(0, 0); render(); }
  else if (t === "duel" || t === "o-duelintro" || t === "o-pickwait") paintProg();
  else render(true);
  if (t === "o-duelintro") paintProg();
}
function paintProg() {
  const el = $("#oprog"); if (!el || !O.s) return;
  const done = O.s.players.filter(p => p.cand).length, n = O.s.players.length;
  el.textContent = done + " joueur" + (done > 1 ? "s" : "") + " sur " + n + " ont terminé leurs duels";
}

/* ----- duels en ligne ----- */
function onlineFinal(w) {
  S.screen = "o-pickwait"; render(true);
  osend({ t: "pick", cand: w.id });
}
function onConflict(taken) {
  S.taken = new Set(taken); S.tiebreak = true;
  const pool = CANDS.filter(c => !S.taken.has(c.id));
  const a = (S.lastLoser && !S.taken.has(S.lastLoser)) ? byId(S.lastLoser) : rand(pool);
  const b = rand(pool.filter(c => c.id !== a.id));
  S.duel = { n: 10, a: a.id, b: b.id, picked: null };
  S.screen = "duel"; window.scrollTo(0, 0); render();
}
function onlineStartRound() {
  const idx = O.s.phase === "results" ? O.s.round + 1 : 0;
  const r = planRound(idx);
  osend({ t: "startRound", theme: r.theme });
}

Object.assign(A, {

  async oCreate() {
    const name = (O.name || "").trim();
    if (!name) { O.err = "Entre ton prénom pour commencer."; render(true); return; }
    O.err = ""; O.busy = true; render(true);
    try { await oconnect(); osend({ t: "create", name }); }
    catch (e) { O.busy = false; O.err = "Impossible de joindre le serveur. Réessaie dans un instant."; render(true); }
  },
  async oJoin() {
    const name = (O.name || "").trim(), code = (O.codeIn || "").trim().toUpperCase();
    if (!name) { O.err = "Entre ton prénom pour commencer."; render(true); return; }
    if (code.length !== 4) { O.err = "Le code de la salle fait 4 lettres."; render(true); return; }
    O.err = ""; O.busy = true; render(true);
    try { await oconnect(); osend({ t: "join", code, name }); }
    catch (e) { O.busy = false; O.err = "Impossible de joindre le serveur. Réessaie dans un instant."; render(true); }
  },
  oShare() {
    const url = location.origin + location.pathname + "?salle=" + O.code;
    if (navigator.share) { navigator.share({ title: "Le Grand Débat", text: "Rejoins ma salle : " + O.code, url }).catch(() => { }); }
    else if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).then(() => toast("Lien copié !")).catch(() => toast(url)); }
    else toast(url);
  },
  oSettings(d) {
    const set = O.s.settings;
    osend({ t: "settings", rounds: d.k === "rounds" ? +d.v : set.rounds, minutes: d.k === "minutes" ? +d.v : set.minutes, mode: d.k === "mode" ? d.v : set.mode, themes: set.themes });
  },
  oPick(d) {
    const set = O.s.settings, l = (set.themes || []).slice(), i = l.indexOf(d.k);
    if (i >= 0) l.splice(i, 1); else if (l.length < 3) l.push(d.k);
    osend({ t: "settings", rounds: set.rounds, minutes: set.minutes, mode: "theme", themes: l });
  },
  oStart() { osend({ t: "start" }); },
  oReady() {
    const me = O.s.players.find(p => p.id === O.pid);
    S.dp = { name: me.name, seen: [] }; S.taken = new Set(O.s.taken);
    S.onFinal = onlineFinal; S.tiebreak = false; S.lastLoser = null;
    startDuels(S.dp); go("duel"); paintProg();
  },
  oStartRound() { onlineStartRound(); },
  oFinishVote() { osend({ t: "finishVote" }); }
});

document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.o;
  if (!k) return;
  if (k === "name") O.name = e.target.value;
  if (k === "code") { const v = e.target.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4); e.target.value = v; O.codeIn = v; }
});
document.addEventListener("click", () => { try { T.ctx = T.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (T.ctx.state === "suspended") T.ctx.resume(); } catch (e) { } }, { once: true });

function onlineBoot() {
  const q = new URLSearchParams(location.search);
  const c = (q.get("salle") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  if (c) O.codeIn = c;
  const ses = loadSession();
  if (ses && ses.code && ses.pid && ses.token) {
    O.code = ses.code; O.pid = ses.pid; O.token = ses.token; O.name = ses.name || "";
    S.screen = "o-connecting"; render();
    oconnect().then(() => osend({ t: "rejoin", code: O.code, pid: O.pid, token: O.token }))
      .catch(() => { clearSession(); resetOnline(); go("home"); });
  } else if (c) { A.oMenu(); }
}

render();
onlineBoot();
</script>
</body>
</html>
